services:
  cli-proxy-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: cli-proxy-api:local
    pull_policy: build
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
    networks:
      - cpa-network

  cpa-usage-keeper:
    image: ghcr.io/willxup/cpa-usage-keeper:latest
    container_name: cpa-usage-keeper
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    ports:
      - "8318:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CPA_BASE_URL: ${CPA_BASE_URL:-http://cli-proxy-api:8317}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:-}
      REDIS_QUEUE_ADDR: ${REDIS_QUEUE_ADDR:-cli-proxy-api:8317}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      APP_BASE_PATH: ${APP_BASE_PATH:-/cpa}
    volumes:
      - ./keeper:/data
    networks:
      - cpa-network

networks:
  cpa-network:
    driver: bridge

